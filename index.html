<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>مفاجأة آية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: one full-screen "page" at a time, a storybook that turns from envelope to twilight.
   Single deliberate look (pastel pink to dusk), so no dark-mode variants. */
:root {
  --bg: #ffe6ef;
  --pink-50: #fff6f9;
  --pink-100: #ffe6ef;
  --pink-200: #ffd0e1;
  --rose: #f7a3c0;
  --red: #c2255c;
  --lav-100: #efe8ff;
  --lav-200: #dcd0ff;
  --lav-deep: #8b78d6;
  --cream: #fff8ec;
  --cream-2: #fdeed6;
  --ink: #5b2a43;
  --ink-soft: #7d4560;
  --glass: rgba(255, 255, 255, 0.58);
  --glass-border: rgba(255, 255, 255, 0.85);
  --shadow: 0 10px 30px rgba(194, 37, 92, 0.16);
  --shadow-lg: 0 20px 50px rgba(194, 37, 92, 0.22);
  --font: 'Cairo', 'Tajawal', 'Segoe UI', Tahoma, system-ui, sans-serif;
  --font-hand: 'Aref Ruqaa', 'Cairo', serif;
  --nav-h: 62px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
body {
  margin: 0; min-height: 100dvh; direction: rtl;
  font-family: var(--font); color: var(--ink); background: var(--bg);
  line-height: 1.8; overflow-x: clip; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, p, ol, ul, figure { margin: 0; padding: 0; }
ol, ul { list-style: none; }
:focus-visible { outline: 3px solid var(--lav-deep); outline-offset: 3px; border-radius: 12px; }

.app { position: relative; min-height: 100dvh; isolation: isolate; }
.stage { position: relative; z-index: 2; width: 100%; padding-top: calc(var(--nav-h) + env(safe-area-inset-top, 0px)); outline: none; display: block; }
.screen {
  position: relative; min-height: calc(100dvh - var(--nav-h)); max-width: 920px; margin-inline: auto;
  padding: 20px 18px 56px; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 22px; text-align: center;
}
.enter { animation: enter 0.6s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
.leave { animation: leave 0.4s ease forwards; }
@keyframes enter { from { opacity: 0; transform: translateY(28px); filter: blur(8px); } }
@keyframes leave { to { opacity: 0; transform: translateY(-22px); filter: blur(8px); } }
.rise { animation: rise 0.9s ease-out backwards; animation-delay: var(--d, 0s); }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } }

.title { font-size: clamp(1.45rem, 5.6vw, 2.3rem); font-weight: 800; line-height: 1.5; color: var(--red); text-wrap: balance; text-shadow: 0 2px 0 rgba(255,255,255,0.7); }
.title-lg { font-size: clamp(1.4rem, 5.4vw, 2.1rem); max-width: 22ch; }
.subtitle { font-size: clamp(1.05rem, 3.8vw, 1.35rem); font-weight: 600; max-width: 34ch; text-wrap: balance; }
.subtitle.soft { font-weight: 400; color: var(--ink-soft); font-size: clamp(0.95rem, 3.4vw, 1.1rem); max-width: 44ch; }
.glass { background: var(--glass); border: 1.5px solid var(--glass-border); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.cta-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }

.cta {
  position: relative; border: 0; padding: 14px 30px; min-height: 52px; min-width: 170px; max-width: 100%;
  border-radius: 999px; font-weight: 800; font-size: clamp(1rem, 3.8vw, 1.15rem); line-height: 1.4;
  transition: transform 0.2s, filter 0.2s, opacity 0.2s;
}
.cta:hover:not(:disabled) { transform: scale(1.04); }
.cta:active:not(:disabled) { transform: scale(0.96); }
.cta-primary { color: #fff; background: linear-gradient(135deg, #e8517f, #c2255c 70%); box-shadow: 0 10px 26px rgba(194,37,92,0.38), inset 0 1px 0 rgba(255,255,255,0.45); animation: cta-glow 2.8s ease-in-out infinite; }
.cta-soft { color: var(--red); background: linear-gradient(135deg, #fff, var(--pink-100)); border: 2px solid var(--rose); box-shadow: 0 6px 18px rgba(194,37,92,0.16); }
.cta-light { color: #5b1a3c; background: linear-gradient(135deg, #fff, #ffe0ee); box-shadow: 0 0 28px rgba(255,190,220,0.55); }
.cta:disabled { cursor: default; filter: saturate(0.7); opacity: 0.75; animation: none; }
@keyframes cta-glow {
  0%, 100% { box-shadow: 0 10px 26px rgba(194,37,92,0.38), 0 0 0 0 rgba(240,71,111,0.35), inset 0 1px 0 rgba(255,255,255,0.45); }
  50% { box-shadow: 0 12px 32px rgba(194,37,92,0.5), 0 0 0 12px rgba(240,71,111,0), inset 0 1px 0 rgba(255,255,255,0.45); }
}
.icon-btn { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--glass-border); background: rgba(255,255,255,0.7); color: var(--red); box-shadow: 0 4px 12px rgba(194,37,92,0.14); transition: transform 0.2s, background 0.2s; padding: 0; }
.icon-btn:hover { transform: scale(1.08); }
.icon-btn.is-on { background: linear-gradient(135deg, #e8517f, #c2255c); color: #fff; }
.icon-btn svg, .lb-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* nav */
.nav { position: fixed; inset: 0 0 auto 0; z-index: 50; padding: env(safe-area-inset-top, 0px) 12px 0; height: calc(var(--nav-h) + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 12px; background: linear-gradient(to bottom, rgba(255,246,249,0.85), rgba(255,246,249,0)); transition: background 1s; }
.nav-logo { display: flex; align-items: center; gap: 6px; font-weight: 800; color: var(--red); flex-shrink: 0; transition: color 1s; }
.progress { position: relative; flex: 1; min-width: 0; max-width: 340px; height: 12px; margin-inline: auto; border-radius: 999px; background: rgba(255,255,255,0.7); border: 1px solid rgba(224,82,127,0.25); overflow: hidden; }
.progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #f7a3c0, #e0527f, #c2255c); transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
.nav-actions { display: flex; gap: 8px; flex-shrink: 0; }
.app[data-theme='dusk'] .nav { background: linear-gradient(to bottom, rgba(30,27,75,0.7), rgba(30,27,75,0)); }
.app[data-theme='dusk'] .nav-logo { color: #ffd6e8; }
.app[data-theme='dusk'] .progress { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.35); }

/* background */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg-day, .bg-dusk { position: absolute; inset: 0; transition: opacity 1.4s ease; }
.bg-day { background: radial-gradient(120% 80% at 50% 0%, #fff6f9 0%, #ffe6ef 40%, #ffd0e1 75%, #e9ddff 100%); }
.bg-dusk { opacity: 0; background: linear-gradient(to bottom, #1e1b4b 0%, #4a2c7a 32%, #a64d8f 62%, #f08aa8 86%, #ffc7b8 100%); }
.app[data-theme='dusk'] .bg-dusk { opacity: 1; }
.app[data-theme='dusk'] .bg-day { opacity: 0; }
.bg-glow { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.55; animation: drift 18s ease-in-out infinite alternate; }
.bg-glow-a { width: 46vmax; height: 46vmax; top: -14vmax; inset-inline-start: -12vmax; background: #ffc2d9; }
.bg-glow-b { width: 40vmax; height: 40vmax; bottom: -12vmax; inset-inline-end: -10vmax; background: #d9ccff; animation-delay: -6s; }
.bg-glow-c { width: 26vmax; height: 26vmax; top: 40%; inset-inline-end: 20%; background: #fff0c9; opacity: 0.4; animation-delay: -10s; }
.app[data-theme='dusk'] .bg-glow { opacity: 0.22; }
@keyframes drift { to { transform: translate3d(4vmax, 3vmax, 0) scale(1.12); } }
.star { position: absolute; border-radius: 50%; background: #fff; box-shadow: 0 0 8px 2px rgba(255,255,255,0.9), 0 0 14px 4px rgba(255,190,220,0.6); opacity: 0.35; animation: twinkle 3s ease-in-out infinite; }
.app[data-theme='dusk'] .star { opacity: 0.9; }
@keyframes twinkle { 0%, 100% { opacity: 0.15; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.25); } }
.bg-clouds { position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s ease; }
.app[data-theme='dusk'] .bg-clouds { opacity: 1; }
.cloud { position: absolute; right: -40%; border-radius: 999px; background: radial-gradient(closest-side, rgba(255,205,225,0.75), rgba(255,205,225,0)); filter: blur(10px); animation: cloud-move linear infinite; }
@keyframes cloud-move { to { transform: translateX(-180vw); } }
.float-heart { position: absolute; bottom: -40px; opacity: 0; filter: drop-shadow(0 4px 8px rgba(194,37,92,0.25)); animation: float-up linear infinite; }
@media (max-width: 600px) { .float-heart:nth-child(n + 9) { display: none; } }
@keyframes float-up {
  0% { transform: translate3d(0,0,0) rotate(-8deg); opacity: 0; }
  12% { opacity: 0.75; }
  50% { transform: translate3d(var(--sway), -55vh, 0) rotate(8deg); }
  88% { opacity: 0.6; }
  100% { transform: translate3d(calc(var(--sway) * -1), -112vh, 0) rotate(-6deg); opacity: 0; }
}

.heart-svg.beat { animation: heartbeat 1.6s ease-in-out infinite; transform-origin: center; }
.heart-svg.glow { filter: drop-shadow(0 0 14px rgba(240,71,111,0.65)); }
@keyframes heartbeat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.14); } 28% { transform: scale(1); } 42% { transform: scale(1.1); } 70% { transform: scale(1); } }

.burst { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
.burst-particle { position: absolute; top: 50%; left: 50%; line-height: 1; will-change: transform, opacity; }

/* 1 intro */
.env-wrap { position: relative; width: min(340px, 86vw); padding: 70px 0 10px; display: grid; place-items: center; }
.env-glow { position: absolute; width: 120%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,0.95), rgba(255,214,230,0.6) 55%, transparent); animation: breathe 5s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(0.94); opacity: 0.8; } 50% { transform: scale(1.06); opacity: 1; } }
.envelope { --ew: min(280px, 72vw); position: relative; width: var(--ew); height: calc(var(--ew) * 0.68); filter: drop-shadow(0 18px 24px rgba(194,37,92,0.28)); perspective: 900px; animation: bob 3.6s ease-in-out infinite; }
.envelope.opened { animation: none; }
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -10px; } }
.env-back { position: absolute; inset: 0; border-radius: 14px; background: linear-gradient(160deg, #f6a7c3, #e47ba2); z-index: 0; }
.env-letter { position: absolute; inset: 9% 8% 6% 8%; z-index: 2; padding: 14px 16px; border-radius: 8px; background: linear-gradient(180deg, #fffdf6, var(--cream-2)); display: flex; flex-direction: column; gap: 8px; align-items: center; box-shadow: 0 -2px 8px rgba(0,0,0,0.06); transition: transform 0.7s ease-out 0s; }
.opened .env-letter { transform: translateY(-92px); transition-delay: 0.55s; }
.env-letter-line { width: 80%; height: 5px; border-radius: 4px; background: rgba(224,82,127,0.3); }
.env-letter-line.short { width: 52%; }
.env-letter-heart { margin-top: 4px; font-size: 1.4rem; }
.env-front { position: absolute; inset: 0; z-index: 4; border-radius: 14px; }
.env-front-left { background: linear-gradient(120deg, #fbb8cf, #ee8eb0); clip-path: polygon(0 0, 50% 52%, 0 100%); }
.env-front-right { background: linear-gradient(240deg, #fbb8cf, #ee8eb0); clip-path: polygon(100% 0, 50% 52%, 100% 100%); }
.env-front-bottom { background: linear-gradient(0deg, #f48db0, #fbb0c9); clip-path: polygon(0 100%, 50% 46%, 100% 100%); }
.env-flap { position: absolute; inset: 0 0 auto 0; height: 56%; z-index: 5; transform-origin: top center; background: linear-gradient(180deg, #ffc9dc, #f391b3); clip-path: polygon(0 0, 100% 0, 50% 100%); border-radius: 14px 14px 0 0; transition: transform 0.7s ease-in-out, z-index 0s 0s; }
.opened .env-flap { transform: rotateX(180deg); z-index: 1; transition: transform 0.7s ease-in-out, z-index 0s 0.35s; }
.env-seal { position: absolute; z-index: 8; top: 56%; left: 50%; translate: -50% -50%; width: 58px; height: 58px; border: 0; padding: 0; border-radius: 50%; display: grid; place-items: center; font-size: 1.7rem; color: #fff; background: radial-gradient(circle at 35% 30%, #ff7a9f, #c2255c 70%); box-shadow: 0 6px 14px rgba(120,10,50,0.4), inset 0 2px 3px rgba(255,255,255,0.45); animation: heartbeat 2s ease-in-out infinite; transition: scale 0.35s, opacity 0.35s, rotate 0.35s; }
.opened .env-seal { scale: 0; opacity: 0; rotate: 40deg; pointer-events: none; }
.deco { position: absolute; pointer-events: none; filter: drop-shadow(0 4px 6px rgba(194,37,92,0.2)); }
.deco-flower { font-size: 1.8rem; animation: sway 5s ease-in-out infinite alternate; }
.deco.f1 { bottom: -2px; inset-inline-start: 6%; }
.deco.f2 { bottom: 6px; inset-inline-end: 8%; font-size: 2.1rem; animation-delay: -2s; }
.deco.f3 { bottom: -8px; inset-inline-start: 38%; font-size: 1.4rem; animation-delay: -3.5s; }
.deco-spark { font-size: 1.3rem; animation: twinkle 2.6s ease-in-out infinite; }
.deco.s1 { top: 40px; inset-inline-start: 4%; }
.deco.s2 { top: 70px; inset-inline-end: 6%; animation-delay: -1.2s; }
@keyframes sway { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }

/* 2 letter + 7 gift letter */
.paper, .hand-letter { position: relative; width: min(560px, 100%); padding: 34px 26px 26px; border-radius: 10px 10px 18px 18px; text-align: start; background: repeating-linear-gradient(to bottom, transparent 0 33px, rgba(224,82,127,0.12) 33px 34px), linear-gradient(180deg, #fffdf6, var(--cream) 60%, var(--cream-2)); box-shadow: var(--shadow-lg), inset 0 0 0 1px rgba(224,82,127,0.18); color: var(--ink); }
.paper { cursor: pointer; }
.paper::before, .hand-letter::before { content: ''; position: absolute; inset-block: 0; inset-inline-start: 18px; width: 2px; background: rgba(224,82,127,0.25); }
.paper-tape { position: absolute; top: -14px; left: 50%; translate: -50% 0; width: 110px; height: 28px; background: rgba(220,208,255,0.85); transform: rotate(-3deg); border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
.paper p, .paper h2, .hand-letter p, .hand-letter h2 { padding-inline-start: 14px; }
.letter-block { animation: letter-in 1s ease-out backwards; }
@keyframes letter-in { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } }
.letter-title h2 { font-family: var(--font-hand); font-size: clamp(1.4rem, 5.2vw, 1.8rem); color: var(--red); margin-bottom: 14px; line-height: 1.6; }
.letter-p p, .letter-highlight p { font-size: clamp(1.02rem, 3.7vw, 1.15rem); line-height: 2; margin-bottom: 12px; }
.letter-highlight p { font-family: var(--font-hand); font-size: clamp(1.3rem, 5vw, 1.65rem); font-weight: 700; color: var(--red); text-align: center; padding-inline-start: 0; margin-block: 6px 14px; }
.letter-sign p { white-space: pre-line; font-family: var(--font-hand); font-size: 1.4rem; color: var(--red); line-height: 1.7; }
.letter-heart { display: flex; justify-content: center; margin-top: 10px; }
.tap-hint { margin-top: 8px; font-size: 0.85rem; color: var(--ink-soft); text-align: center; padding-inline-start: 0 !important; }

/* 3 story */
.date-badge { display: inline-flex; gap: 10px; align-items: center; padding: 8px 24px; border-radius: 999px; font-size: clamp(1.2rem, 5vw, 1.6rem); font-weight: 800; color: #fff; background: linear-gradient(135deg, #e8517f, #c2255c); box-shadow: var(--shadow); }
.timeline { position: relative; width: min(560px, 100%); display: flex; flex-direction: column; gap: 22px; padding-inline-start: 46px; text-align: start; }
.timeline-line { position: absolute; inset-block: 14px; inset-inline-start: 17px; width: 4px; border-radius: 4px; background: repeating-linear-gradient(to bottom, var(--rose) 0 10px, transparent 10px 18px); transform-origin: top; animation: grow 1.6s ease-in-out 0.3s backwards; }
@keyframes grow { from { transform: scaleY(0); } }
.timeline-item { position: relative; }
.timeline-dot { position: absolute; inset-inline-start: -46px; top: 12px; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; color: #fff; font-size: 1rem; line-height: 1; background: linear-gradient(135deg, #f58cb0, #c2255c); box-shadow: 0 0 0 5px rgba(255,255,255,0.7), var(--shadow); }
.timeline-card { padding: 16px 20px; border-radius: 22px; font-size: clamp(1rem, 3.6vw, 1.12rem); line-height: 1.95; min-width: 0; }

/* 4 gallery */
.scrap-grid { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 16px; padding: 10px 4px; }
@media (min-width: 700px) { .scrap-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px 24px; } }
.scrap-item { position: relative; transform: rotate(var(--tilt, 0deg)); transition: transform 0.3s; animation: rise 0.6s ease-out backwards; animation-delay: var(--d, 0s); }
.scrap-item:hover { transform: rotate(0) scale(1.04); z-index: 3; }
.polaroid { position: relative; display: block; width: 100%; padding: 10px 10px 12px; border: 0; border-radius: 6px; background: #fff; box-shadow: 0 10px 24px rgba(91,42,67,0.22); transition: box-shadow 0.25s; }
.polaroid:hover { box-shadow: 0 18px 34px rgba(91,42,67,0.3); }
.tape { position: absolute; z-index: 2; top: -11px; left: 50%; translate: -50% 0; width: 64px; height: 20px; background: rgba(247,163,192,0.75); transform: rotate(4deg); border-radius: 3px; }
.scrap-item:nth-child(even) .tape { background: rgba(220,208,255,0.9); transform: rotate(-5deg); }
.polaroid-img { width: 100%; aspect-ratio: 3 / 4; border-radius: 3px; }
.polaroid-caption { display: block; margin-top: 10px; min-height: 3.2em; font-family: var(--font-hand); font-size: clamp(0.95rem, 3.4vw, 1.1rem); line-height: 1.6; text-wrap: balance; }
.safe-img { position: relative; overflow: hidden; background: linear-gradient(135deg, var(--pink-200), var(--lav-200)); }
.safe-img img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 0.5s; object-fit: cover; }
.safe-img.contain img { object-fit: contain; }
.safe-img.ok img { opacity: 1; }
.img-fallback { position: absolute; inset: 0; display: grid; place-items: center; font-size: 3rem; background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.8), transparent 45%), linear-gradient(135deg, var(--pink-200), var(--lav-200)); }
.safe-img.ok .img-fallback { display: none; }
.safe-img:not(.ok):not(.error) .img-fallback { background-size: 200% 100%; background-image: linear-gradient(100deg, var(--pink-100) 30%, #fff 50%, var(--pink-100) 70%); animation: shimmer 1.4s linear infinite; }
.safe-img:not(.ok):not(.error) .img-fallback span { opacity: 0.4; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

.lightbox { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: 70px 14px 24px; background: rgba(43,12,30,0.88); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); touch-action: pan-y; animation: fade 0.25s ease; }
@keyframes fade { from { opacity: 0; } }
.lb-figure { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; width: min(92vw, 560px); animation: lb-in 0.3s ease; touch-action: pan-y; user-select: none; }
@keyframes lb-in { from { opacity: 0; transform: translateX(calc(var(--dir, 1) * -50px)) scale(0.96); } }
.lb-img { width: 100%; height: min(72dvh, 680px); border-radius: 14px; background: rgba(255,255,255,0.06); }
.lb-figure figcaption { font-family: var(--font-hand); color: #fff; font-size: 1.25rem; text-align: center; }
.lb-count { color: rgba(255,255,255,0.7); font-size: 0.9rem; }
.lb-btn { position: absolute; z-index: 3; width: 48px; height: 48px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(255,255,255,0.18); transition: background 0.2s; }
.lb-btn:hover { background: rgba(255,255,255,0.32); }
.lb-btn svg { width: 24px; height: 24px; }
.lb-close { top: calc(14px + env(safe-area-inset-top, 0px)); inset-inline-start: 14px; }
.lb-next { top: 50%; left: 10px; translate: 0 -50%; }
.lb-prev { top: 50%; right: 10px; translate: 0 -50%; }

/* 5 timer */
.counter { width: min(520px, 100%); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 2.4vw, 16px); }
.tile { display: flex; flex-direction: column; align-items: center; padding: clamp(12px, 3vw, 20px) 4px; border-radius: 22px; }
.tile-num { display: block; font-size: clamp(1.7rem, 8vw, 2.9rem); font-weight: 800; line-height: 1.2; color: var(--red); font-variant-numeric: tabular-nums; }

    var ps = s.querySelectorAll('.finale-text p'); F.paragraphs.forEach(function (t, i) { ps[i].textContent = t; });
    $('.love-line', s).textContent = F.loveLine; $('.signature', s).textContent = F.signature;
    $('.cta', s).addEventListener('click', function () { chime(); goTo(0); });
    return s;
  }

  var STEPS = [Intro, Letter, Story, Gallery, Timer, Messages, Gift, Finale];
  var LAST = STEPS.length - 1, step = 0, locked = false;

  /* ---------- navigation ---------- */
  var btnBack = $('#btn-back'), btnRestart = $('#btn-restart'), prog = $('#progress'), fill = $('#progress-fill');
  function updateNav() {
    var pct = Math.round((step / LAST) * 100);
    fill.style.width = Math.max(pct, 4) + '%';
    prog.setAttribute('aria-valuenow', String(pct));
    prog.setAttribute('aria-valuetext', STEP_NAMES[step] + ' — ' + (step + 1) + ' من ' + STEPS.length);
    btnBack.hidden = step === 0; btnRestart.hidden = step === 0;
    app.dataset.theme = step === LAST ? 'dusk' : 'day';
    stage.setAttribute('aria-label', STEP_NAMES[step]);
  }
  function errorSection() {
    var s = el('<section class="screen"><div class="note-card glass"><p>حصلت مشكلة صغيرة 🥺 بس مفيش حاجة بتضيع.</p></div>' + cta('نبدأ من الأول 💗') + '</section>');
    $('.cta', s).addEventListener('click', function () { goTo(0); });
    return s;
  }
  function mount(n) {
    runCleanups(); lbClose(); step = n;
    var sec;
    try { sec = STEPS[n](); } catch (err) { if (window.console) console.error(err); sec = errorSection(); }
    stage.innerHTML = ''; stage.appendChild(sec); sec.classList.add('enter');
    updateNav(); window.scrollTo(0, 0);
    try { stage.focus({ preventScroll: true }); } catch (e) {}
  }
  function show(n) {
    var old = stage.firstElementChild;
    runCleanups();
    if (old && !reduced) { old.classList.add('leave'); setTimeout(function () { mount(n); }, 400); } else mount(n);
  }
  function goTo(n, push) {
    if (locked) return;
    n = Math.min(Math.max(n, 0), LAST);
    locked = true;
    if (push !== false) { try { history.pushState({ step: n }, ''); } catch (e) {} }
    show(n);
    setTimeout(function () { locked = false; }, reduced ? 60 : 900);
  }
  btnBack.addEventListener('click', function () {
    if (locked || step === 0) return;
    var st = null; try { st = history.state; } catch (e) {}
    if (st && st.step === step) { try { history.back(); return; } catch (e) {} }
    goTo(step - 1, false);
  });
  btnRestart.addEventListener('click', function () { goTo(0); });
  window.addEventListener('popstate', function (e) {
    var n = e.state && typeof e.state.step === 'number' ? e.state.step : 0;
    show(Math.min(Math.max(n, 0), LAST));
  });
  try { history.replaceState({ step: 0 }, ''); } catch (e) {}

  mount(0);
})();
</script>

</body></html>
